server {
    listen 80;
    server_name api.milobroker.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }
    location / { return 301 https://api.milobroker.com$request_uri; }
}

server {
    listen 443 ssl;
    server_name api.milobroker.com;
    ssl_certificate /etc/letsencrypt/live/api.milobroker.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.milobroker.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    # Omit query strings: webhook verification requests contain a verify token.
    access_log /var/log/nginx/milobroker-api.access.log milobroker_api;
    error_log /var/log/nginx/milobroker-api.error.log;
    include /etc/nginx/snippets/milobroker-proxy.conf;

    location = /atlas {
        return 308 /atlas/;
    }
    location = /marketplace {
        return 308 /marketplace/;
    }
    location = /concierge {
        return 308 /concierge/;
    }

    # Keep operational endpoints private even with broad service routing.
    location = /atlas/actuator { return 404; }
    location ^~ /atlas/actuator/ { return 404; }
    location = /marketplace/actuator { return 404; }
    location ^~ /marketplace/actuator/ { return 404; }
    location = /concierge/actuator { return 404; }
    location ^~ /concierge/actuator/ { return 404; }

    # Preserve the existing restrictions for internal business/message APIs.
    location ^~ /marketplace/api/v1/onboarding/ { return 404; }
    # Listing writes and media stay internal; search remains the only public marketplace path.
    # Open GET under this prefix if public listing-detail pages ever ship.
    location ^~ /marketplace/api/v1/listings { return 404; }
    # Leads stay internal like listing writes; guests never see requester data.
    location ^~ /marketplace/api/v1/leads { return 404; }
    location ^~ /concierge/api/v1/concierge/ { return 404; }
    location ^~ /concierge/api/v1/whatsapp/webhook/profile { return 404; }

    # Trailing slashes strip service prefixes; Java controllers keep /api/...
    location /atlas/ {
        proxy_pass http://127.0.0.1:8083/;
    }
    location /marketplace/ {
        proxy_pass http://127.0.0.1:8082/;
    }
    location /concierge/ {
        proxy_pass http://127.0.0.1:8081/;
    }

    # Unprefixed paths have no public proxy route.
    location / { return 404; }
}
