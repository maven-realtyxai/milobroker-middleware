server {
    listen 80;
    server_name api.milobroker.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }
    location / { return 301 https://api.milobroker.com$request_uri; }
}

server {
    listen 443 ssl;
    server_name api.milobroker.com;
    ssl_certificate /etc/letsencrypt/live/api.milobroker.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.milobroker.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    # Omit query strings: webhook verification requests contain a verify token.
    access_log /var/log/nginx/milobroker-api.access.log milobroker_api;
    error_log /var/log/nginx/milobroker-api.error.log;
    include /etc/nginx/snippets/milobroker-proxy.conf;

    location ^~ /api/v1/geo/ {
        proxy_pass http://127.0.0.1:8083;
    }
    location = /api/contact {
        proxy_pass http://127.0.0.1:8083;
    }
    location = /api/v1/search {
        proxy_pass http://127.0.0.1:8082;
    }
    location = /api/v1/whatsapp/webhook {
        proxy_pass http://127.0.0.1:8081;
    }
    location = /api/v1/flows/onboarding {
        proxy_pass http://127.0.0.1:8081;
    }

    # Internal APIs and actuator endpoints have no public proxy route.
    location / { return 404; }
}
