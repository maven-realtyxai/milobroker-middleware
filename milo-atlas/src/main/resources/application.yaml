spring:
  application.name: milo-atlas
  profiles.default: local
  config:
    import:
      - "optional:file:../.env.${spring.profiles.active:local}[.properties]"
      - "optional:file:./.env.${spring.profiles.active:local}[.properties]"
  datasource:
    url: ${ATLAS_DB_URL:jdbc:postgresql://localhost:5432/staticdb}
    username: ${ATLAS_DB_USERNAME:staticdb_app}
    password: ${ATLAS_DB_PASSWORD:milobroker-local}
    hikari:
      maximum-pool-size: ${ATLAS_DB_POOL_MAX:10}
      minimum-idle: ${ATLAS_DB_POOL_MIN:2}
      connection-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 600000
  jpa:
    open-in-view: false
    hibernate.ddl-auto: none
  threads.virtual.enabled: ${VIRTUAL_THREADS_ENABLED:true}
server:
  port: ${ATLAS_PORT:8083}
  shutdown: graceful
  forward-headers-strategy: native
logging:
  level.root: ${LOG_LEVEL:INFO}
  level.com.milobroker: ${LOG_LEVEL_APP:INFO}
  file.path: ${LOG_PATH:logs}
milobroker:
  cors:
    allowed-origins: ${ATLAS_CORS_ALLOWED_ORIGINS:https://milobroker.com,https://www.milobroker.com,http://localhost:5173,http://127.0.0.1:4173}
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true
  endpoint.health.show-details: never
  info.env.enabled: true
