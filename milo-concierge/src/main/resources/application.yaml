spring:
  application.name: milo-concierge
  profiles.default: local
  config:
    import:
      - "optional:file:../.env.${spring.profiles.active:local}[.properties]"
      - "optional:file:./.env.${spring.profiles.active:local}[.properties]"
  datasource:
    url: ${CONCIERGE_DB_URL:jdbc:postgresql://localhost:5432/conciergedb}
    username: ${CONCIERGE_DB_USERNAME:concierge_app}
    password: ${CONCIERGE_DB_PASSWORD:milobroker-local}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: none
  logging:
    file.path: ${LOG_PATH:logs}
server:
  port: ${CONCIERGE_PORT:8081}
  shutdown: graceful
management:
  endpoints.web.exposure.include: health,info,metrics,prometheus
  endpoint.health.probes.enabled: true
milobroker:
  internal:
    deletion-secret: ${INTERNAL_DELETION_SECRET:}
  downstream:
    marketplace-base-url: ${MARKETPLACE_BASE_URL:http://localhost:8082}
    atlas-base-url: ${ATLAS_BASE_URL:http://localhost:8083}
  meta:
    enabled: ${META_MODEL_ENABLED:false}
    base-url: ${META_MODEL_BASE_URL:https://api.meta.ai/v1}
    api-key: ${MODEL_API_KEY:}
    model: ${META_MODEL_NAME:}
    temperature: ${META_MODEL_TEMPERATURE:0.3}
    max-tokens: ${META_MODEL_MAX_TOKENS:300}
    system-prompt: ${META_MODEL_SYSTEM_PROMPT:}
  whatsapp:
    verify-token: ${WHATSAPP_VERIFY_TOKEN:change-me}
    api-token: ${WHATSAPP_API_TOKEN:}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:1415608411630431}
    messaging-account-id: ${WHATSAPP_MESSAGING_ACCOUNT_ID:1057188817349490}
    onboarding-flow-id: ${WHATSAPP_ONBOARDING_FLOW_ID:}
    api-base-url: ${WHATSAPP_API_BASE_URL:https://graph.facebook.com/v21.0}
  flow:
    private-key-pem: ${FLOW_PRIVATE_KEY_PEM:}
    app-secret: ${META_APP_SECRET:}
