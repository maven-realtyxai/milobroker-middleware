services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: milobroker
      POSTGRES_PASSWORD: milobroker-local
      POSTGRES_DB: postgres
    ports: ["5432:5432"]
    volumes:
      - milobroker-postgres:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U milobroker -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  milobroker-postgres:
